<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตามสถานะพัสดุ — ทันควัน DISPATCH</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Sarabun:wght@400;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/tankwan-core.css">
<style>
  .wrap-narrow{ max-width:700px; margin:40px auto; padding:0 6%; }
  .track-card{ background:#fff; border-radius:16px; padding:32px; box-shadow:0 10px 30px rgba(0,0,0,0.05); }

  .search-row{ display:flex; gap:10px; margin-bottom:24px; }
  .search-row input{ flex:1; padding:12px 16px; border:2px solid var(--line); border-radius:8px; font-family:'IBM Plex Mono', monospace; }
  .search-row input:focus{ outline:none; border-color:var(--coral); }

  .track-header{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid #eee; padding-bottom:16px; margin-bottom:24px; flex-wrap:wrap; gap:10px; }
  .track-id{ font-family:'IBM Plex Mono', monospace; font-size:1.3rem; font-weight:700; color:var(--ink); }

  .timeline{ position:relative; padding-left:30px; border-left:3px solid #e5e7eb; margin-left:10px; }
  .step{ position:relative; margin-bottom:24px; }
  .step::before{ content:''; position:absolute; left:-38px; top:4px; width:14px; height:14px; border-radius:50%; background:#d1d5db; border:3px solid #fff; }
  .step.done::before{ background:var(--green); }
  .step.active::before{ background:var(--coral); box-shadow:0 0 0 4px rgba(255,92,92,0.2); }
  .step-time{ font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--gray); }
  .step-title{ font-weight:700; font-size:0.95rem; }

  .action-row{ display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
  .action-row .btn{ flex:1; min-width:140px; }
  .updated-lbl{ font-size:.78rem; color:var(--gray-light); text-align:right; margin-top:8px; }

  .rider-card{ margin-top:20px; padding-top:18px; border-top:1px dashed #E5E7EB; display:flex; align-items:center; gap:14px; }
  .rider-avatar{ width:44px; height:44px; background:#E5E7EB; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo"><i class="fa-solid fa-bolt"></i> ทันควัน DISPATCH</a>
  <button class="nav-toggle" aria-label="เปิดเมนู" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
  <nav>
    <a href="index.html">หน้าหลัก</a>
    <a href="tankwan-booking.html">จองส่งพัสดุ</a>
    <a href="tankwan-tracking.html">ติดตามพัสดุ</a>
    <a href="tankwan-rates.html">เช็คราคา</a>
    <a href="tankwan-help.html">ช่วยเหลือ</a>
  </nav>
</header>

<div class="wrap-narrow">
  <div class="track-card">
    <div class="search-row">
      <label for="trackInput" class="visually-hidden">รหัสพัสดุ</label>
      <input type="text" id="trackInput" placeholder="ใส่รหัสพัสดุ เช่น TKW-889900">
      <button class="btn btn-coral" id="trackBtn"><i class="fa-solid fa-magnifying-glass"></i> ค้นหา</button>
    </div>

    <div class="track-header">
      <div>
        <div style="font-size:0.85rem; color:var(--gray);">หมายเลขพัสดุ</div>
        <div class="track-id" id="trackIdDisplay">—</div>
      </div>
      <span class="badge badge-green" id="statusBadge">กำลังจัดส่ง</span>
    </div>

    <div class="timeline" id="timeline"></div>

    <div class="rider-card" id="riderCard" style="display:none;">
      <div class="rider-avatar"><i class="fa-solid fa-user-ninja"></i></div>
      <div>
        <div style="font-weight:700; font-size:.92rem;">สมชาย วงศ์ใหญ่ (ไรเดอร์ประจำพื้นที่)</div>
        <div style="font-size:0.82rem; color:var(--gray);">ทะเบียน กข-4921 เชียงใหม่ · 089-999-XXXX</div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn btn-outline" id="refreshBtn"><i class="fa-solid fa-rotate"></i> รีเฟรชสถานะ</button>
      <button class="btn btn-outline" id="copyBtn"><i class="fa-solid fa-link"></i> คัดลอกลิงก์ติดตาม</button>
    </div>
    <div class="updated-lbl" id="updatedLbl"></div>
  </div>
</div>

<footer class="site-footer">
  <p>© 2026 ทันควัน DISPATCH · เว็บไซต์จำลองสำหรับโปรเจกต์การเรียน</p>
</footer>

<script src="js/tankwan-utils.js"></script>
<script src="js/tankwan-nav.js"></script>
<script src="js/tankwan-audio.js"></script>
<script>
  const timelineEl = document.getElementById('timeline');
  const trackInput = document.getElementById('trackInput');

  function renderTimeline(trackId){
    const { steps, statusLabel, done } = Tankwan.buildMockTimeline(trackId);
    document.getElementById('trackIdDisplay').textContent = trackId;
    const badge = document.getElementById('statusBadge');
    badge.textContent = statusLabel;
    badge.className = 'badge ' + (done ? 'badge-green' : 'badge-amber');
    document.getElementById('riderCard').style.display = done ? 'none' : 'flex';

    timelineEl.innerHTML = steps.map(s => `
      <div class="step ${s.state === 'pending' ? '' : s.state}">
        <div class="step-time">${s.time}</div>
        <div class="step-title">${s.title}</div>
      </div>
    `).join('');

    const now = new Date();
    document.getElementById('updatedLbl').textContent =
      'อัปเดตล่าสุด ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
  }

  function loadFromInput(){
    const id = trackInput.value.trim();
    if (!id) {
      Tankwan.showToast('กรุณาใส่รหัสพัสดุก่อนค้นหา', 'error');
      return;
    }
    const params = new URLSearchParams(window.location.search);
    params.set('track_id', id);
    history.replaceState(null, '', '?' + params.toString());
    renderTimeline(id);
  }

  document.getElementById('trackBtn').addEventListener('click', loadFromInput);
  trackInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadFromInput(); });
  document.getElementById('refreshBtn').addEventListener('click', () => {
    const id = document.getElementById('trackIdDisplay').textContent;
    if (id && id !== '—') { renderTimeline(id); Tankwan.showToast('รีเฟรชสถานะล่าสุดแล้ว', 'success'); }
  });
  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard?.writeText(window.location.href).then(() => {
      Tankwan.showToast('คัดลอกลิงก์ติดตามแล้ว', 'success');
    }).catch(() => Tankwan.showToast('ไม่สามารถคัดลอกลิงก์ได้', 'error'));
  });

  // ---- โหลดค่าเริ่มต้นจาก ?track_id= ในลิงก์ (แก้บั๊กเดิมที่หน้านี้เพิกเฉยพารามิเตอร์นี้) ----
  const initialId = new URLSearchParams(window.location.search).get('track_id') || 'TKW-889900';
  trackInput.value = initialId;
  renderTimeline(initialId);
</script>

</body>
</html>
