<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>พื้นที่ให้บริการ — ทันควัน DISPATCH</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/tankwan-core.css">
<style>
  .wrap-narrow{ max-width:850px; margin:40px auto; padding:0 6%; }
  .zone-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-top:20px; }
  .zone-card{ background:#fff; padding:24px; border-radius:12px; border-left:5px solid var(--coral); box-shadow:0 5px 15px rgba(0,0,0,0.04); transition:box-shadow .15s; }
  .zone-card.matched{ box-shadow:0 0 0 3px var(--coral-soft), 0 5px 15px rgba(0,0,0,0.04); }
  .zone-card h3{ font-family:'Chakra Petch', sans-serif; margin-bottom:8px; }

  .checker{ padding:24px; margin-bottom:10px; }
  .checker-row{ display:flex; gap:10px; }
  .checker-row input{ flex:1; padding:12px 16px; border:2px solid var(--line); border-radius:8px; }
  .checker-row input:focus{ outline:none; border-color:var(--coral); }
  .checker-result{ margin-top:14px; font-size:.92rem; min-height:1.4em; }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo"><i class="fa-solid fa-bolt"></i> ทันควัน DISPATCH</a>
  <button class="nav-toggle" aria-label="เปิดเมนู" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
  <nav>
    <a href="index.html">หน้าหลัก</a>
    <a href="tankwan-booking.html">จองส่งพัสดุ</a>
    <a href="tankwan-tracking.html">ติดตามพัสดุ</a>
    <a href="tankwan-rates.html">เช็คราคา</a>
    <a href="tankwan-dropoff.html">จุดดรอป/ล็อกเกอร์</a>
    <a href="tankwan-coverage.html">พื้นที่บริการ</a>
    <a href="tankwan-help.html">ช่วยเหลือ</a>
  </nav>
</header>

<div class="wrap-narrow">
  <h1 style="font-family:'Chakra Petch';">พื้นที่ครอบคลุมการจัดส่งด่วน</h1>

  <div class="card checker">
    <h3 style="margin-bottom:10px;"><i class="fa-solid fa-magnifying-glass-location" style="color:var(--coral);"></i> เช็คพื้นที่ของคุณ</h3>
    <div class="checker-row">
      <label for="areaInput" class="visually-hidden">พิมพ์ชื่อตำบล/อำเภอ</label>
      <input type="text" id="areaInput" placeholder="พิมพ์ชื่อตำบล/อำเภอ เช่น นิมมาน, หางดง, ลำพูน">
      <button class="btn btn-coral" id="areaCheckBtn">ตรวจสอบ</button>
    </div>
    <div class="checker-result" id="areaResult"></div>
  </div>

  <div class="zone-grid" id="zoneGrid"></div>
</div>

<footer class="site-footer">
  <p>© 2026 ทันควัน DISPATCH · เว็บไซต์จำลองสำหรับโปรเจกต์การเรียน</p>
</footer>

<script src="js/tankwan-utils.js"></script>
<script src="js/tankwan-nav.js"></script>
<script src="js/tankwan-audio.js"></script>
<script>
  const zoneGrid = document.getElementById('zoneGrid');
  const zoneEtaColor = { A: 'green', B: 'green', C: '#8A5A00' };

  function renderZones(matchedZone){
    zoneGrid.innerHTML = Tankwan.ZONES.map(z => `
      <div class="zone-card ${matchedZone && matchedZone.zone === z.zone ? 'matched' : ''}">
        <h3><i class="fa-solid fa-location-dot" style="color:var(--coral);"></i> ${z.label}</h3>
        <p>${z.areas.join(', ')}</p>
        <small style="color:${z.zone === 'C' ? '#8A5A00' : 'green'}; font-weight:700;">${z.eta}</small>
      </div>
    `).join('');
  }
  renderZones(null);

  function checkArea(){
    const q = document.getElementById('areaInput').value.trim();
    const resultEl = document.getElementById('areaResult');
    if (!q) {
      resultEl.innerHTML = '';
      renderZones(null);
      return;
    }
    const zone = Tankwan.findZoneByArea(q);
    if (zone) {
      resultEl.innerHTML = `<span class="badge badge-green"><i class="fa-solid fa-circle-check"></i> อยู่ใน ${zone.label}</span> &nbsp; ${zone.eta}`;
      renderZones(zone);
    } else {
      resultEl.innerHTML = `<span class="badge badge-gray"><i class="fa-solid fa-circle-question"></i> ไม่พบพื้นที่นี้ในระบบ</span> &nbsp; กรุณาติดต่อฝ่ายขายเพื่อสอบถามเพิ่มเติม`;
      renderZones(null);
    }
  }
  document.getElementById('areaCheckBtn').addEventListener('click', checkArea);
  document.getElementById('areaInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkArea(); });
</script>

</body>
</html>
